<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Refrigeration Cycle</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="src/timeline.js"></script>
<script src="src/render.js"></script>
<script>
  const ctx = document.getElementById('c').getContext('2d');
  // Used by scripts/render-frames.js: draw frame at time t, return it as a PNG data URL.
  window.renderAt = (t) => {
    RefrigerationCycle.drawFrame(ctx, t);
    return ctx.canvas.toDataURL('image/png');
  };
  window.ready = document.fonts.load('700 40px Inter').then(() => document.fonts.load('500 20px Inter'));
  // Opened directly in a browser: play it in real time.
  if (!navigator.webdriver) {
    const t0 = performance.now();
    const tick = () => {
      RefrigerationCycle.drawFrame(ctx, ((performance.now() - t0) / 1000) % TIMELINE.duration);
      requestAnimationFrame(tick);
    };
    window.ready.then(tick);
  }
</script>
</body>
</html>
